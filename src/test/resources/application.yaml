spring:
  datasource:
    url: jdbc:h2:mem:market;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:65535

app:
  security:
    internal-key: test-internal-key
  mas-api:
    base-url: https://example.test
    stock-endpoint: /api/v2/vs
    market-endpoint: /api/v1/market
    trading-endpoint: /api/v1/tradingview
  mas-realtime:
    enabled: false
  static-data:
    sync-dir: build/test-static-data

redis:
  host: localhost
  port: 6379
  password: ""
  database: 0
  timeout: 200
