server:
  port: ${MARKET_SERVICE_PORT}

logging:
  level:
    # Kafka can repeatedly report missing/refreshing metadata while topics settle.
    # Keep the MAS receive trace visible without filling Docker logs with warnings.
    org.apache.kafka.clients.NetworkClient: ERROR

spring:
  config:
    import: optional:file:../predict-deploy/.env[.properties]
  application:
    name: predict-market-service
  datasource:
    url: ${DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${MARKET_SERVICE_KAFKA_CONSUMER_GROUP_ID}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  security:
    internal-key: ${MARKET_SERVICE_API_KEY}
  mas-api:
    base-url: ${MARKET_SERVICE_MAS_BASE_URL}
    stock-endpoint: ${MARKET_SERVICE_MAS_STOCK_ENDPOINT}
    market-endpoint: ${MARKET_SERVICE_MAS_MARKET_ENDPOINT}
    trading-endpoint: ${MARKET_SERVICE_MAS_TRADING_ENDPOINT}
  mas-realtime:
    enabled: ${MARKET_SERVICE_MAS_DIRECT_SUBSCRIBER_ENABLED}
    websocket-url: ${MARKET_SERVICE_MAS_WS_URL}
    origin: ${MARKET_SERVICE_MAS_WS_ORIGIN}
    cookie: ${MARKET_SERVICE_MAS_WS_COOKIE}
    auth-token: ${MARKET_SERVICE_MAS_WS_AUTH_TOKEN}
    subscription-batch-size: ${MARKET_SERVICE_MAS_WS_SUBSCRIPTION_BATCH_SIZE}
    max-symbols: ${MARKET_SERVICE_MAS_WS_MAX_SYMBOLS}
    reconnect-initial-delay-ms: ${MARKET_SERVICE_MAS_WS_RECONNECT_INITIAL_DELAY_MS}
    reconnect-max-delay-ms: ${MARKET_SERVICE_MAS_WS_RECONNECT_MAX_DELAY_MS}
    trace-enabled: ${MARKET_SERVICE_MAS_WS_TRACE_ENABLED}
  static-data:
    sync-dir: ${STATIC_DATA_SYNC_DIR}
config:
  warrant:
    analysis:
      default-min-time-to-maturity: ${MARKET_SERVICE_WARRANT_MIN_MATURITY}
      default-max-breakeven-increase-pct: ${MARKET_SERVICE_WARRANT_MAX_BREAKEVEN_PCT}
      default-sort-by: ${MARKET_SERVICE_WARRANT_SORT_BY}
      default-sort-direction: ${MARKET_SERVICE_WARRANT_SORT_DIRECTION}

redis:
  host: ${DATA_REDIS_HOST}
  port: ${DATA_REDIS_PORT}
  password: ${REDIS_PASSWORD}
  database: ${DATA_REDIS_DATABASE}
  timeout: ${DATA_REDIS_TIMEOUT}
