server:
  port: ${SERVER_PORT:8003}

logging:
  level:
    # Kafka can repeatedly report missing/refreshing metadata while topics settle.
    # Keep the MAS receive trace visible without filling Docker logs with warnings.
    org.apache.kafka.clients.NetworkClient: ERROR

spring:
  application:
    name: predict-market-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fadx_home}
    username: ${SPRING_DATASOURCE_USERNAME:fadx}
    password: ${SPRING_DATASOURCE_PASSWORD:f@D*P@ss}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:predict-market-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  security:
    internal-key: ${APP_INTERNAL_KEY:}
  mas-api:
    base-url: ${MAS_BASE_URL:https://masboard.masvn.com}
    stock-endpoint: ${MAS_STOCK_ENDPOINT:/api/v2/vs}
    market-endpoint: ${MAS_MARKET_ENDPOINT:/api/v1/market}
    trading-endpoint: ${MAS_TRADING_ENDPOINT:/api/v1/tradingview}
  mas-realtime:
    enabled: ${MAS_DIRECT_SUBSCRIBER_ENABLED:true}
    websocket-url: ${MAS_WS_URL:wss://masboard.masvn.com/ws/}
    origin: ${MAS_WS_ORIGIN:https://masboard.masvn.com}
    cookie: ${MAS_WS_COOKIE:}
    auth-token: ${MAS_WS_AUTH_TOKEN:}
    subscription-batch-size: ${MAS_WS_SUBSCRIPTION_BATCH_SIZE:20}
    max-symbols: ${MAS_WS_MAX_SYMBOLS:0}
    reconnect-initial-delay-ms: ${MAS_WS_RECONNECT_INITIAL_DELAY_MS:1000}
    reconnect-max-delay-ms: ${MAS_WS_RECONNECT_MAX_DELAY_MS:30000}
    trace-enabled: ${MAS_WS_TRACE_ENABLED:true}
  static-data:
    sync-dir: ${APP_STATIC_DATA_SYNC_DIR:data/static}
config:
  warrant:
    analysis:
      default-min-time-to-maturity: ${APP_WARRANT_MIN_MATURITY:0.25}
      default-max-breakeven-increase-pct: ${APP_WARRANT_MAX_BREAKEVEN_PCT:10}
      default-sort-by: ${APP_WARRANT_SORT_BY:breakevenIncreasePct}
      default-sort-direction: ${APP_WARRANT_SORT_DIRECTION:ASC}

redis:
  host: ${SPRING_DATA_REDIS_HOST:localhost}
  port: ${SPRING_DATA_REDIS_PORT:6379}
  password: ${SPRING_DATA_REDIS_PASSWORD:}
  database: ${SPRING_DATA_REDIS_DATABASE:0}
  timeout: ${SPRING_DATA_REDIS_TIMEOUT:2000}
