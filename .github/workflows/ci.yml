name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Build and test predict-market-service
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting, test, and build
        run: ./gradlew clean spotlessCheck build --no-daemon

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          IMAGE_REPOSITORY="${IMAGE_REPOSITORY,,}"
          docker build \
            --tag "$IMAGE_REPOSITORY:${GITHUB_SHA}" \
            --tag "$IMAGE_REPOSITORY:latest" \
            .
          docker push "$IMAGE_REPOSITORY:${GITHUB_SHA}"
          docker push "$IMAGE_REPOSITORY:latest"
