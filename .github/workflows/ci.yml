name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test predict-market-service
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting, test, and build
        run: ./gradlew clean spotlessCheck build --no-daemon
